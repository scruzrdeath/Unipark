<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Parking Monitor</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#6b7a89; --line:#dde3e9;
          --free:#2e9e5b; --reserved:#e0a21b; --occupied:#d64545; --accent:#2457c5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1b232c; --text:#e8edf2; --muted:#8fa0b0; --line:#2b3642; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
           padding:16px; max-width:1000px; margin:0 auto; }
  h1 { font-size:20px; margin:0; }
  .muted { color:var(--muted); }
  main { max-width:1000px; margin:0 auto; padding:0 16px 32px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .zones { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px; }
  .spot { border:0; border-radius:8px; padding:12px 0; color:#fff; font-weight:600; cursor:default; }
  .spot.FREE { background:var(--free); cursor:pointer; }
  .spot.RESERVED { background:var(--reserved); }
  .spot.OCCUPIED { background:var(--occupied); }
  .legend span { margin-right:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  [hidden] { display:none !important; }
  input { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  button.act { padding:6px 10px; border:1px solid var(--accent); background:transparent; color:var(--accent);
               border-radius:6px; cursor:pointer; margin-left:6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  .login { max-width:420px; margin:40px auto 0; }
  .form { display:grid; gap:10px; }
  #msg { max-width:420px; margin:0 auto; text-align:center; }
  #msg { min-height:22px; font-weight:600; }
  #msg.err { color:var(--occupied); } #msg.ok { color:var(--free); }
</style>
</head>
<body>
<header>
  <h1>Campus Parking Monitor</h1>
  <div class="muted" id="topbar" hidden>
    Simulated time: <strong id="clock">--</strong> &middot;
    <strong id="who"></strong>
    <button class="act" id="btnLogout">Log out</button>
  </div>
</header>
<main>
  <div class="card login" id="auth">
    <h2 style="margin-top:0;font-size:18px">Sign in to see the parking map</h2>
    <div class="muted" style="margin-bottom:12px">New here? Pick a username and password and press Register: you will be signed in automatically.</div>
    <div class="form">
      <input id="username" placeholder="username" maxlength="40" autocomplete="username">
      <input id="password" type="password" placeholder="password (8+ chars, letter and digit)" maxlength="72" autocomplete="current-password">
      <div>
        <button class="act" id="btnLogin" style="margin-left:0">Log in</button>
        <button class="act" id="btnRegister">Register</button>
      </div>
    </div>
  </div>
  <div id="msg"></div>
  <div id="app" hidden>
    <div class="muted">Click a green spot to reserve it.</div>
    <div class="legend muted">
      <span><i class="dot" style="background:var(--free)"></i>Free</span>
      <span><i class="dot" style="background:var(--reserved)"></i>Reserved</span>
      <span><i class="dot" style="background:var(--occupied)"></i>Occupied</span>
    </div>
    <div class="zones" id="zones"></div>
    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0;font-size:16px">My open reservations</h2>
      <table>
        <thead><tr><th>User</th><th>Spot</th><th>Status</th><th>Time left (sim min)</th><th></th></tr></thead>
        <tbody id="res"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = null;
try { token = sessionStorage.getItem("token"); } catch (e) {}

function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = kind || ""; }

function setToken(value) {
  token = value;
  try { value ? sessionStorage.setItem("token", value) : sessionStorage.removeItem("token"); } catch (e) {}
}

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { setToken(null); showSession(null); }
  if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : ("HTTP " + res.status));
  return body;
}

const jsonPost = (body) => ({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const credentials = () => ({ username: $("username").value.trim(), password: $("password").value });

function showSession(username) {
  $("auth").hidden = !!username;
  $("app").hidden = !username;
  $("topbar").hidden = !username;
  $("who").textContent = username || "";
  if (!username) { $("zones").replaceChildren(); $("res").replaceChildren(); }
}

async function register() {
  try {
    await api("/api/auth/register", jsonPost(credentials()));
    await login();                      // registered users go straight in
  } catch (e) { say(e.message, "err"); }
}

async function login() {
  try {
    const data = await api("/api/auth/login", jsonPost(credentials()));
    setToken(data.access_token);
    $("password").value = "";
    showSession(credentials().username.toLowerCase());
    say("", "");
    refresh();
  } catch (e) { say(e.message, "err"); }
}

async function logout() {
  try { await api("/api/auth/logout", { method: "POST" }); } catch (e) {}
  setToken(null); showSession(null); say("Logged out.", "ok");
}

async function reserve(spotCode) {
  try { await api("/api/reservations", jsonPost({ spot_code: spotCode })); say("Spot " + spotCode + " reserved.", "ok"); }
  catch (e) { say(e.message, "err"); }
  refresh();
}

async function act(id, what) {
  try { await api("/api/reservations/" + encodeURIComponent(id) + "/" + what, { method: "POST" }); say("Done: " + what, "ok"); }
  catch (e) { say(e.message, "err"); }
  refresh();
}

function el(tag, props = {}, text) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  if (text !== undefined) node.textContent = text;   // textContent: never interpreted as HTML
  return node;
}

function renderMap(data) {
  $("clock").textContent = data.simulated_time.replace("T", " ").slice(0, 19);
  $("zones").replaceChildren();
  for (const z of data.zones) {
    const card = el("div", { className: "card" });
    card.appendChild(el("strong", {}, "Zone " + z.zone));
    card.appendChild(el("span", { className: "muted" },
      " free " + z.free + " / reserved " + z.reserved + " / occupied " + z.occupied + " (of " + z.total + ")"));
    const grid = el("div", { className: "grid" });
    for (const s of z.spots) {
      const b = el("button", { className: "spot " + s.status, title: s.name + " - " + s.status }, s.code);
      if (s.status === "FREE") b.onclick = () => reserve(s.code);
      grid.appendChild(b);
    }
    card.appendChild(grid);
    $("zones").appendChild(card);
  }
}

function renderReservations(list, nowIso) {
  const now = new Date(nowIso).getTime();
  const body = $("res");
  body.replaceChildren();
  if (!list.length) {
    const row = el("tr"); const cell = el("td", { colSpan: 5, className: "muted" }, "None");
    row.appendChild(cell); body.appendChild(row); return;
  }
  for (const r of list) {
    const left = Math.max(0, Math.round((new Date(r.expires_at).getTime() - now) / 60000));
    const row = el("tr");
    row.appendChild(el("td", {}, r.user_code));
    row.appendChild(el("td", {}, r.spot_code));
    row.appendChild(el("td", {}, r.status));
    row.appendChild(el("td", {}, r.status === "ACTIVE" ? String(left) : "-"));
    const action = el("td");
    const btn = el("button", { className: "act" }, r.status === "ACTIVE" ? "Confirm entry" : "Register exit");
    btn.onclick = () => act(r.id, r.status === "ACTIVE" ? "entry" : "exit");
    action.appendChild(btn); row.appendChild(action); body.appendChild(row);
  }
}

async function refresh() {
  if (!token) return;
  try {
    const map = await api("/api/map");
    renderMap(map);
    const list = await api("/api/reservations");
    renderReservations(list, map.simulated_time);
  } catch (e) { say("Connection problem: " + e.message, "err"); }
}

$("btnLogin").onclick = login;
$("btnRegister").onclick = register;
$("btnLogout").onclick = logout;
(async () => {
  showSession(null);
  if (token) {
    try { const me = await api("/api/auth/me"); showSession(me.username); } catch (e) { setToken(null); }
  }
  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
